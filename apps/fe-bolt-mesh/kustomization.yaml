resources:
  - ../../base/app

namePrefix: fe-bolt-mesh-

labels:
  - includeSelectors: true
    pairs:
      app: fe-bolt-mesh

# Exceção ao padrão /<tech>/<ms>: a SPA fica na raiz (http://automation-v1/) e chama a API
# por caminho absoluto (/java/engine-bolt-mesh/api/v1), então não usa strip-prefix.
# Mantido à mão (o pipeline só atualiza newTag).
patches:
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /
      - op: remove
        path: /metadata/annotations

images:
  - name: imagem-padrao
    newName: ghcr.io/kube-automations-v1/fe-bolt-mesh
    newTag: ca1aad07bd566a89b13b3f415fc8de78c6154910
