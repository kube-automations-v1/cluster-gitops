resources:
  - ../../base/app

namePrefix: fe-bolt-mesh-

labels:
  - includeSelectors: true
    pairs:
      app: fe-bolt-mesh

# SPA em /node/bolt-mesh (strip-prefix padrão). O vite.config.ts usa base '/node/bolt-mesh/' no build.
# Mantido à mão (o pipeline só atualiza newTag).
patches:
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /node/bolt-mesh

images:
  - name: imagem-padrao
    newName: ghcr.io/kube-automations-v1/fe-bolt-mesh
    newTag: c87a8b95377117f12577b68cc6d6a7e16fb6b177
