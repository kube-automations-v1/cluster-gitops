apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-service-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - path: /java
        pathType: Prefix
        backend:
          service:
            name: java-service
            port:
              number: 8080
