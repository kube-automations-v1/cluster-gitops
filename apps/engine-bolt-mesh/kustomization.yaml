resources:
  - ../../base/app

namePrefix: engine-bolt-mesh-

labels:
  - includeSelectors: true
    pairs:
      app: engine-bolt-mesh

patches:
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /java/engine-bolt-mesh

  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DB_URL, value: "jdbc:postgresql://base-bolt-mesh-db:5432/bolt_mesh"}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DB_USER, valueFrom: {secretKeyRef: {name: base-bolt-mesh-credentials, key: POSTGRES_USER}}}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: base-bolt-mesh-credentials, key: POSTGRES_PASSWORD}}}

images:
  - name: imagem-padrao
    newName: ghcr.io/kube-automations-v1/engine-bolt-mesh
    newTag: de335e325c151db9fcccbb82da4d9f4fdff435d7
