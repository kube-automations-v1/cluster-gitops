apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-app
spec:
  replicas: 1
  strategy:
    type: Recreate # PVC RWO
  selector:
    matchLabels: {app: glpi-app}
  template:
    metadata:
      labels: {app: glpi-app}
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: app
        image: imagem-padrao:latest
        env:
        - {name: GLPI_DB_HOST, value: glpi-db}
        - {name: GLPI_DB_NAME, valueFrom: {secretKeyRef: {name: glpi-credentials, key: MARIADB_DATABASE}}}
        - {name: GLPI_DB_USER, valueFrom: {secretKeyRef: {name: glpi-credentials, key: MARIADB_USER}}}
        - {name: GLPI_DB_PASSWORD, valueFrom: {secretKeyRef: {name: glpi-credentials, key: MARIADB_PASSWORD}}}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /glpi/, port: 8080}
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 18
        resources:
          requests: {memory: 256Mi, cpu: 100m}
          limits: {memory: 1Gi, cpu: "1"}
        volumeMounts:
        - {name: data, mountPath: /var/glpi}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: glpi-data
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-app
spec:
  selector: {app: glpi-app}
  ports:
  - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glpi-app
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - {path: /glpi, pathType: Prefix, backend: {service: {name: glpi-app, port: {number: 8080}}}}
