apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    # Middleware compartilhado (apps/platform) que remove /<tecnologia>/<ms> do path
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-tech-ms@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: automations
    http:
      paths:
      - path: /tecnologia/ms # sobrescrito em cada apps/<ms>/kustomization.yaml
        pathType: Prefix
        backend:
          service:
            name: app
            port:
              number: 8080
