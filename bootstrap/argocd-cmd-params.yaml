# Aplicar manualmente: kubectl apply -f bootstrap/argocd-cmd-params.yaml && kubectl -n argocd rollout restart deploy argocd-server
# (ArgoCD atrás do Traefik via HTTP, servido em /argocd)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  server.rootpath: /argocd
  server.basehref: /argocd
